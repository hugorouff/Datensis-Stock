security:
    # Les mots de passe sont ceux des comptes Django de Datensis (pbkdf2_sha256)
    password_hashers:
        App\Security\DatensisUser:
            id: App\Security\DjangoPasswordHasher

    providers:
        datensis:
            id: App\Security\DatensisUserProvider

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: datensis
            user_checker: App\Security\DatensisUserChecker
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_accueil
            logout:
                path: app_logout
                target: app_login

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: ROLE_USER }
